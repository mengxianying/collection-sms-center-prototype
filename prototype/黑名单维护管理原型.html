function renderList(){const found=listRows();pageNo=Math.min(pageNo,Math.max(1,Math.ceil(found.length/pageSize)));const shown=found.slice((pageNo-1)*pageSize,pageNo*pageSize);$('#content').innerHTML=heading('黑名单维护','统一维护客户与手机号的短信、自动外呼限制')+`<section class="panel"><form id="query-form" class="filters"><div class="filter"><label for="f-name">客户姓名：</label><input id="f-name" placeholder="请输入客户姓名" value="${esc(filters.name)}"></div><div class="filter"><label for="f-cid">客户编号：</label><input id="f-cid" placeholder="请输入客户编号" value="${esc(filters.cid)}"></div><div class="filter"><label for="f-phone">手机号：</label><input id="f-phone" placeholder="请输入手机号" value="${esc(filters.phone)}"></div><div class="filter"><label for="f-dim">黑名单维度：</label><select id="f-dim">${options([['','全部'],['customer','客户维度'],['phone','手机号维度']],filters.dim)}</select></div><div class="filter"><label for="f-status">名单状态：</label><select id="f-status">${options([['active','生效中'],['covered','被客户维度覆盖'],['removed','已移除'],['','全部']],filters.status)}</select></div><div class="filter-actions"><button class="btn primary" type="submit">查询</button><button class="btn" type="button" id="reset">重置</button></div></form></section><section class="panel"><div class="tabs"><button data-type="sms" class="${tab==='sms'?'active':''}">短信黑名单 <span class="count">${records.filter(r=>r.type==='sms'&&effective(r)).length}</span></button><button data-type="call" class="${tab==='call'?'active':''}">外呼黑名单 <span class="count">${records.filter(r=>r.type==='call'&&r.active).length}</span></button></div><div class="notice"><span class="info-icon">i</span><span>${tab==='sms'?'短信黑名单同时限制自动、手工发送。客户维度限制该客户所有手机号；手机号维度仅限制所选号码。':'外呼黑名单仅支持客户维度，只限制自动外呼，人工仍可拨打。当前自动外呼只拨打注册手机号。'}</span></div><div class="toolbar"><span class="muted" style="font-size:12px">添加黑名单请从案件列表发起</span><span class="muted" style="font-size:12px">共 ${found.length} 条记录</span></div><div class="table-wrap"><table><thead><tr><th>客户信息</th><th>黑名单维度</th><th>限制范围 / 手机号</th><th>加入原因</th><th>加入人 / 时间</th><th>状态</th><th>操作</th></tr></thead><tbody>${shown.map(r=>`<tr><td><button class="link" data-customer="${r.cid}">${customer(r.cid).name}</button><small>${r.cid}</small></td><td><span class="tag ${r.dim==='customer'?'':'purple'}">${r.dim==='customer'?'客户维度':'手机号维度'}</span></td><td>${scope(r)}<small>${sources(r)}</small></td><td title="${esc(r.reason)}">${esc(r.reason.length>14?r.reason.slice(0,14)+'…':r.reason)}</td><td>${esc(r.by)}<small>${r.time}</small></td><td><span class="status ${effective(r)?'':'off'}">${statusText(r)}</span></td><td><button class="link" data-view="${r.id}">详情</button>${r.active?`<button class="link red" data-remove="${r.id}">移除</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="empty"><div class="empty-icon">▤</div>暂无符合条件的黑名单记录</td></tr>'}</tbody></table></div><div class="pagination">共 ${found.length} 条<select id="page-size" aria-label="每页条数">${options([['5','5条/页'],['10','10条/页'],['20','20条/页']],String(pageSize))}</select><button id="prev" aria-label="上一页" ${pageNo===1?'disabled':''}>‹</button><button class="active">${pageNo}</button><button id="next" aria-label="下一页" ${pageNo*pageSize>=found.length?'disabled':''}>›</button></div></section>`;
$('#query-form').onsubmit=e=>{e.preventDefault();filters={name:$('#f-name').value.trim(),cid:$('#f-cid').value.trim(),phone:$('#f-phone').value.trim(),dim:$('#f-dim').value,status:$('#f-status').value};pageNo=1;renderList()};$('#reset').onclick=()=>{filters={name:'',phone:'',dim:'',status:'active',cid:''};pageNo=1;renderList()};document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{tab=b.dataset.type;pageNo=1;renderList()});$('#page-size').onchange=e=>{pageSize=+e.target.value;pageNo=1;renderList()};$('#prev').onclick=()=>{pageNo--;renderList()};$('#next').onclick=()=>{pageNo++;renderList()};bindRecordActions()}
function bindRecordActions(){document.querySelectorAll('[data-customer]').forEach(b=>b.onclick=()=>{detailCustomer=b.dataset.customer;go('detail')});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>viewRecord(+b.dataset.view));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeRecord(+b.dataset.remove))}
let focusBefore;
function modal(title,body,foot){focusBefore=document.activeElement;$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;$('#modal-foot').innerHTML=foot;$('#overlay').hidden=false;$('.close').focus();$('.close').onclick=closeModal;$('#cancel')?.addEventListener('click',closeModal)}

function openAdd(cid,prephone='',source='案件列表'){
if(page!=='cases'||!customer(cid))return;formSource='案件列表';const c=customer(cid),customerSms=hasCustomerSms(cid);if(customerSms)prephone='';
modal('加入黑名单',`<dl class="detail-grid"><dt>客户</dt><dd>${c.name}　<span class="muted">${c.id}</span><input id="add-customer" type="hidden" value="${cid}"></dd></dl>
<div class="formrow"><div class="formlabel"><span class="req">*</span>黑名单类型</div><div><div class="radio-line"><label><input type="checkbox" name="type" value="sms" ${tab==='sms'?'checked':''}>短信黑名单</label><label><input type="checkbox" name="type" value="call" ${tab==='call'?'checked':''}>外呼黑名单</label></div><div class="helper">可同时选择。短信和外呼分别设置限制范围，保存后可独立编辑、移除。</div></div></div>
<section id="sms-config" class="blacklist-config"><h3>短信黑名单设置</h3><div class="formrow"><div class="formlabel">短信维度</div><div class="radio-line"><label><input type="radio" name="dim" value="customer" ${!prephone?'checked':''}>客户维度</label><label><input type="radio" name="dim" value="phone" ${customerSms?'disabled':''} ${prephone?'checked':''}>手机号维度</label></div></div>
${customerSms?'<div class="helper" style="margin:0 0 14px">该客户已有客户维度短信黑名单，已覆盖全部手机号，不能再添加手机号维度记录。</div>':''}<div id="phone-field" class="formrow"><div class="formlabel"><span class="req">*</span>短信手机号</div><div><div class="phone-options">${c.phones.map(p=>`<label class="phone-option"><input type="checkbox" name="phone" value="${p.n}" ${prephone===p.n?'checked':''}><b style="font-weight:400">${mask(p.n)}</b><span>${p.src.join(' / ')}</span></label>`).join('')}</div><div class="helper">可多选；仅限制选中的具体号码，相同号码合并展示。</div></div></div></section>
<section id="call-config" class="blacklist-config"><h3>外呼黑名单设置</h3><div class="formrow"><div class="formlabel">外呼维度</div><div><span class="tag" style="margin-top:5px">客户维度</span><div class="helper">固定为客户维度，不受短信维度和短信手机号选择影响。仅禁止自动外呼；人工仍可拨打。</div></div></div></section>
<div class="formrow"><div class="formlabel">生效范围</div><div id="scope-preview"></div></div>
<div class="formrow" style="margin-bottom:0"><label class="formlabel" for="reason"><span class="req">*</span>加入原因</label><div><textarea id="reason" maxlength="200" placeholder="请填写加入黑名单的原因，最多200字"></textarea><div class="helper" style="text-align:right"><span id="reason-count">0</span> / 200</div><div id="form-error" class="error" role="alert"></div></div></div>`,`<button class="btn" id="cancel">取消</button><button class="btn primary" id="confirm-add">确认加入</button>`);
function preview(){
const sms=$('input[name=type][value=sms]').checked,call=$('input[name=type][value=call]').checked,dim=$('input[name=dim]:checked').value,phones=[...document.querySelectorAll('input[name=phone]:checked')].map(x=>x.value);
$('#sms-config').hidden=!sms;$('#call-config').hidden=!call;$('#phone-field').style.display=sms&&dim==='phone'?'grid':'none';
const smsText=dim==='customer'?'该客户全部手机号禁止自动、手工发送短信。':phones.length?phones.map(mask).join('、')+'禁止自动、手工发送短信，其他号码不受本条记录限制。':'请选择需要禁止发送短信的手机号。';
$('#scope-preview').innerHTML=(sms?`<div class="scope-box"><strong>短信 · ${dim==='customer'?'客户维度':'手机号维度'}</strong>${smsText}</div>`:'')+(call?'<div class="scope-box" style="margin-top:8px"><strong>外呼 · 客户维度</strong>该客户禁止自动外呼，人工仍可拨打。当前自动外呼仅使用注册手机号。</div>':'')+(!sms&&!call?'<div class="helper">请至少选择一种黑名单类型。</div>':'')+(sms&&dim==='customer'&&records.some(r=>r.active&&r.cid===cid&&r.type==='sms'&&r.dim==='phone')?'<div class="warning">加入后，原手机号维度短信记录将被客户维度覆盖，不再单独生效。</div>':'');
}
document.querySelectorAll('input[name=type],input[name=dim],input[name=phone]').forEach(x=>x.onchange=preview);
$('#reason').oninput=e=>$('#reason-count').textContent=e.target.value.length;$('#confirm-add').onclick=submitAdd;preview();
}
function submitAdd(){
const cid=$('#add-customer').value,types=[...document.querySelectorAll('input[name=type]:checked')].map(x=>x.value),smsDim=$('input[name=dim]:checked').value,smsPhones=[...document.querySelectorAll('input[name=phone]:checked')].map(x=>x.value),reason=$('#reason').value.trim();
const err=!customer(cid)?'请选择客户':!types.length?'请至少选择一种黑名单类型':types.includes('sms')&&smsDim==='phone'&&hasCustomerSms(cid)?'该客户已有客户维度短信黑名单，不能再添加手机号维度记录':types.includes('sms')&&smsDim==='phone'&&!smsPhones.length?'请至少选择一个短信手机号':!reason?'请填写加入原因':'';
if(err){$('#form-error').textContent=err;return}
const pairs=[];
if(types.includes('sms'))(smsDim==='customer'?['']:smsPhones).forEach(phone=>pairs.push({type:'sms',dim:smsDim,phone}));
if(types.includes('call'))pairs.push({type:'call',dim:'customer',phone:''});
const fresh=pairs.filter(p=>!records.some(r=>r.active&&r.cid===cid&&r.type===p.type&&r.dim===p.dim&&r.phone===p.phone));
if(!fresh.length){$('#form-error').textContent='所选对象已在对应黑名单中，无需重复加入。';return}
let id=Math.max(...records.map(r=>r.id))+1;const now=new Date().toLocaleString('sv-SE');
fresh.forEach(p=>records.unshift({id:id++,cid,...p,reason,source:formSource,by:'孟宪迎',time:now,active:true}));
save();closeModal();render();if(page==='cases')manageCustomerBlacklist(cid);toast(`已加入 ${fresh.length} 条黑名单${pairs.length>fresh.length?'，重复记录已跳过':''}`);
}
function restoreHint(r){const n=records.filter(x=>x.id!==r.id&&x.cid===r.cid&&x.active&&x.type==='sms'&&x.dim==='phone').length;return r.active&&r.type==='sms'&&r.dim==='customer'&&n?`<div class="helper">移除后，原有 ${n} 条手机号维度短信记录将恢复生效，对应号码仍不能发送短信。</div>`:''}
function effect(r){if(covered(r))return '本条手机号记录被客户维度短信黑名单覆盖，当前不单独生效；该客户全部手机号仍禁止自动、手工发送短信。';return (r.dim==='customer'?'该客户全部手机号':mask(r.phone))+(r.type==='sms'?'禁止自动、手工发送短信。':'禁止自动外呼，人工仍可拨打。')}
function removeRecord(id,onBack){const r=records.find(r=>r.id===id);modal('移除黑名单',`<div class="notice"><span class="info-icon">i</span><span>确认移除 ${customer(r.cid).name} 的${typeName(r.type)}记录？</span></div>${restoreHint(r)}<dl class="detail-grid" style="margin-top:22px"><dt>客户</dt><dd>${customer(r.cid).name}　<span class="muted">${r.cid}</span></dd><dt>黑名单类型</dt><dd>${typeName(r.type)}</dd><dt>黑名单维度</dt><dd>${r.dim==='customer'?'客户维度':'手机号维度'}</dd><dt>限制范围</dt><dd>${scope(r)}<div class="helper">${sources(r)}</div></dd><dt>加入原因</dt><dd>${esc(r.reason)}</dd><dt>加入人 / 时间</dt><dd>${esc(r.by)}　${r.time}</dd><dt>名单状态</dt><dd><span class="status ${effective(r)?'':'off'}">${statusText(r)}</span></dd></dl><div class="scope-box">${effect(r)}${r.type==='call'?'<br>当前自动外呼仅使用注册手机号。':''}</div>`,`<button class="btn" id="cancel">取消</button><button class="btn danger" id="confirm-remove">确认移除</button>`);if(onBack)$('#cancel').onclick=onBack;$('#confirm-remove').onclick=()=>{r.active=false;r.removed=new Date().toLocaleString('sv-SE');r.removedBy='孟宪迎';save();closeModal();render();if(onBack)onBack();toast('已移除黑名单')}}
function viewRecord(id){const r=records.find(x=>x.id===id);modal('黑名单详情',`<dl class="detail-grid"><dt>客户</dt><dd>${customer(r.cid).name}　<span class="muted">${r.cid}</span></dd><dt>黑名单类型</dt><dd>${typeName(r.type)}</dd><dt>黑名单维度</dt><dd>${r.dim==='customer'?'客户维度':'手机号维度'}</dd><dt>限制范围</dt><dd>${scope(r)}<div class="helper">${sources(r)}</div></dd><dt>加入原因</dt><dd>${esc(r.reason)}</dd><dt>加入人 / 时间</dt><dd>${esc(r.by)}　${r.time}</dd><dt>名单状态</dt><dd><span class="status ${effective(r)?'':'off'}">${statusText(r)}</span></dd></dl><div class="scope-box">${effect(r)}${r.type==='call'?'<br>当前自动外呼仅使用注册手机号。':''}</div>`,`<button class="btn" id="cancel">关闭</button>${r.active?'<button class="btn" id="detail-remove">移除黑名单</button>':''}`);$('#detail-remove')?.addEventListener('click',()=>removeRecord(id))}
function manageCustomerBlacklist(cid){
const c=customer(cid),active=records.filter(r=>r.cid===cid&&r.active);
modal('黑名单管理',`<div class="toolbar" style="margin-top:0"><div><b>${c.name}</b><div class="helper">共 ${active.filter(effective).length} 条生效记录${active.some(covered)?`，${active.filter(covered).length} 条被客户维度覆盖`:''}</div></div><button class="btn primary" id="manager-add">＋ 加入黑名单</button></div><div class="phone-options">${active.map(r=>`<div style="padding:16px;border-bottom:1px solid #ebeef5"><div style="display:flex;justify-content:space-between;gap:12px"><div><b style="font-weight:500">${typeName(r.type)}</b>　<span class="tag ${r.dim==='customer'?'':'purple'}">${r.dim==='customer'?'客户维度':'手机号维度'}</span></div><div style="white-space:nowrap"><button class="link" data-manager-edit="${r.id}">编辑</button><button class="link red" data-manager-remove="${r.id}">移除</button></div></div><div style="margin-top:8px">${scope(r)}　<span class="status ${effective(r)?'':'off'}">${statusText(r)}</span></div><div class="helper">${sources(r)}</div><div class="helper">加入原因：${esc(r.reason)}</div></div>`).join('')||'<div class="empty" style="height:auto;padding:40px">该客户暂无生效黑名单，可点击“加入黑名单”。</div>'}</div>`,`<button class="btn" id="cancel">关闭</button>`);
$('#manager-add').onclick=()=>{openAdd(cid);$('#cancel').onclick=()=>manageCustomerBlacklist(cid)};
document.querySelectorAll('[data-manager-edit]').forEach(b=>b.onclick=()=>editBlacklist(+b.dataset.managerEdit));

function editBlacklist(id){
const r=records.find(x=>x.id===id),c=customer(r.cid);
modal('编辑黑名单',`<dl class="detail-grid"><dt>客户</dt><dd>${c.name}　<span class="muted">${c.id}</span></dd></dl><div class="formrow"><label class="formlabel" for="edit-type">黑名单类型</label><select id="edit-type">${options([['sms','短信黑名单'],['call','外呼黑名单']],r.type)}</select></div><div class="formrow"><label class="formlabel" for="edit-dim">黑名单维度</label><select id="edit-dim">${options([['customer','客户维度'],['phone','手机号维度']],r.dim)}</select></div><div id="edit-dimension-note" class="helper" style="margin:-12px 0 18px 111px"></div><div class="formrow" id="edit-phone-row"><label class="formlabel" for="edit-phone">手机号</label><select id="edit-phone">${c.phones.map(p=>`<option value="${p.n}" ${p.n===r.phone?'selected':''}>${mask(p.n)}　${p.src.join(' / ')}</option>`).join('')}</select></div><div id="edit-preview" class="scope-box" style="margin-bottom:18px"></div><div class="formrow"><label class="formlabel" for="edit-reason"><span class="req">*</span>加入原因</label><textarea id="edit-reason" maxlength="200">${esc(r.reason)}</textarea></div><div class="error" id="edit-error" role="alert"></div>`,`<button class="btn" id="cancel">取消</button><button class="btn primary" id="save-edit">保存修改</button>`);
$('#cancel').onclick=()=>manageCustomerBlacklist(r.cid);
function preview(){const type=$('#edit-type').value,call=type==='call';if(call)$('#edit-dim').value='customer';$('#edit-dim').disabled=call;const restricted=!call&&hasCustomerSms(r.cid,r.id);$('#edit-dim').querySelector('option[value=phone]').disabled=restricted;if(restricted&&r.type!=='sms')$('#edit-dim').value='customer';$('#edit-dimension-note').textContent=call?'外呼黑名单仅支持客户维度。':restricted?'已有客户维度短信黑名单，不能新增或修改手机号维度配置；被覆盖的原记录可移除。':'短信黑名单可选择客户维度或手机号维度。';const dim=$('#edit-dim').value;$('#edit-phone-row').style.display=dim==='phone'?'grid':'none';$('#save-edit').disabled=restricted&&dim==='phone';$('#edit-preview').textContent=(restricted&&dim==='phone')?'该手机号记录被客户维度覆盖，当前不单独生效。':(dim==='customer'?'该客户全部手机号':mask($('#edit-phone').value))+(type==='sms'?'禁止自动、手工发送短信。':'禁止自动外呼，人工仍可拨打。当前自动外呼仅使用注册手机号。');if(type==='sms'&&dim==='customer'&&records.some(x=>x.id!==r.id&&x.cid===r.cid&&x.active&&x.type==='sms'&&x.dim==='phone'))$('#edit-preview').textContent+=' 保存后，原手机号维度短信记录将被客户维度覆盖，不再单独生效。'}
['#edit-dim','#edit-type','#edit-phone'].forEach(s=>$(s).onchange=preview);preview();
$('#save-edit').onclick=()=>{const type=$('#edit-type').value,dim=$('#edit-dim').value,phone=dim==='phone'?$('#edit-phone').value:'',reason=$('#edit-reason').value.trim();

};
}
function blocked(cid,type,phone){return records.some(r=>effective(r)&&r.cid===cid&&r.type===type&&(r.dim==='customer'||r.phone===phone))}
function renderCases(){$('#content').innerHTML=heading('案件列表','通过“黑名单管理”统一处理当前客户的加入、编辑和移除')+`<section class="panel"><div class="notice"><span class="info-icon">i</span>仅从案件列表添加黑名单，客户由当前案件自动带入；可选择黑名单类型、维度及关联手机号。</div><div class="toolbar"><div class="tabs" style="margin:0;border:0"><button class="active">全部</button><button disabled>提醒</button><button disabled>M1-A</button><button disabled>M1-B</button><button disabled>M2</button><button disabled>M3</button></div><button class="btn" id="manage">黑名单维护</button></div><div class="table-wrap"><table><thead><tr><th>案件编号</th><th>客户姓名</th><th>注册手机号</th><th>催收员</th><th>短信限制</th><th>自动外呼</th><th>操作</th></tr></thead><tbody>${customers.map(c=>`<tr><td><button class="link" data-customer="${c.id}">${c.case}</button></td><td>${c.name}</td><td>${mask(c.phones[0].n)}</td><td>陈静</td><td>${records.some(r=>r.cid===c.id&&r.type==='sms'&&r.active)?'<span class="tag">存在黑名单</span>':'—'}</td><td>${blocked(c.id,'call',c.phones[0].n)?'<span class="tag gray">已限制</span>':'未被黑名单限制'}</td><td><button class="link" data-customer="${c.id}">详情</button><button class="link" data-case-manage="${c.id}">黑名单管理</button></td></tr>`).join('')}</tbody></table></div><div class="pagination">共 ${customers.length} 条　<span>10条/页</span><button class="active">1</button></div></section>`;$('#manage').onclick=()=>go('blacklist');bindRecordActions();document.querySelectorAll('[data-case-manage]').forEach(b=>b.onclick=()=>manageCustomerBlacklist(b.dataset.caseManage))}
function renderCustomer(){const c=customer(detailCustomer);$('#content').innerHTML=`<section class="panel"><div class="case-tabs"><b>作业详情</b><span>订单详情</span><span>催收记录</span><span>短信记录</span><span>客服工单</span></div><div class="card-header"><h2>客户信息</h2></div><div class="section-title">基本信息</div><div class="customer-summary"><div><h2>${c.name} <span class="muted" style="font-size:13px">${c.id}</span></h2><p>企微客服（信审）　—</p><p>个微/企微（贷后）　—</p></div><div>${c.phones.filter(p=>p.src.some(s=>s!=='收货手机号')).map(p=>`<div class="phone-row"><span>${p.src.includes('注册手机号')?'注册手机号':'目前使用手机号'}</span><span>${mask(p.n)}</span></div>`).join('')}${!c.phones.some(p=>p.src.includes('目前使用手机号'))?'<div class="phone-row"><span>目前使用手机号</span><span>—</span></div>':''}</div></div><h2 class="section-divider">黑名单状态</h2><div class="helper">短信同时限制自动、手工发送；自动外呼当前只使用注册手机号，人工外呼不受黑名单限制。</div><div class="table-wrap" style="margin-top:15px"><table><thead><tr><th>手机号</th><th>号码来源</th><th>短信</th><th>自动外呼</th><th>人工外呼</th></tr></thead><tbody>${c.phones.map(p=>`<tr><td>${mask(p.n)}</td><td>${p.src.join(' / ')}</td><td>${blocked(c.id,'sms',p.n)?'<span class="tag gray">禁止发送</span>':'未被黑名单限制'}</td><td>${!p.src.includes('注册手机号')?'当前不用于自动外呼':blocked(c.id,'call',p.n)?'<span class="tag gray">禁止自动外呼</span>':'未被黑名单限制'}</td><td>不受黑名单限制</td></tr>`).join('')}</tbody></table></div><h2 class="section-divider">收货地址</h2><div class="table-wrap" style="margin-top:15px"><table><thead><tr><th>收货人</th><th>收货电话</th><th>收货地址</th></tr></thead><tbody>${c.phones.filter(p=>p.src.includes('收货手机号')).map(p=>`<tr><td>${c.name}</td><td>${mask(p.n)}</td><td>演示地址</td></tr>`).join('')}</tbody></table></div></section>`}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.addEventListener('keydown',e=>{if($('#overlay').hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const f=[...$('.modal').querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled&&x.offsetParent!==null),first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();
</script></body></html>
